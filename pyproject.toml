[project]
name = "tripwire"
version = "0.1.0"
description = "A local guard between AI agents and their tools: blocks prompt-injected, destructive and data-stealing actions."
readme = "README.md"
authors = [
    { name = "Sakshath", email = "srikakulamsakshath@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bashlex>=0.18",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tripwire = "tripwire.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "agentdojo>=0.1.35",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
