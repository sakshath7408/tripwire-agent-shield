# Built-in rules. First match wins and overrides the risk score.
# Add your own in ~/.tripwire/policy.yaml or ./.tripwire.yaml.
rules:
  - id: never-touch-tripwire
    tool: "*"
    match: "(\\.tripwire|tripwire hook|claude/settings(\\.local)?\\.json)"
    capability: write
    decision: block
    reason: Agents may not edit or disable their own guard.
  - id: never-delete-tripwire
    tool: "*"
    match: "(\\.tripwire|claude/settings(\\.local)?\\.json)"
    capability: delete
    decision: block
    reason: Agents may not delete their own guard's settings.

capabilities: {}

# Permission profiles. Pick one per session (TaskSpec.profile). Unlisted tools are blocked.
profiles:
  coding-assistant:
    description: Edits code in the project folder and runs dev commands.
    allow: ["cap:read", "cap:write", "cap:exec", "cap:fetch"]
    ask: ["cap:delete", "cap:send"]
    deny: ["cap:money"]
  inbox-assistant:
    description: Reads mail and files, drafts and sends replies. No money, no shell.
    allow: ["cap:read", "cap:fetch", "cap:send"]
    ask: ["cap:write"]
    deny: ["cap:money", "cap:exec", "cap:delete"]
  finance-assistant:
    description: Reads statements and pays bills, every payment needs approval.
    allow: ["cap:read", "cap:fetch"]
    ask: ["cap:money", "cap:send"]
    deny: ["cap:exec", "cap:delete"]
